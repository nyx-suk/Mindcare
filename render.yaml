services:
  - type: web
    name: mindcare-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mindcare-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: HF_API_TOKEN
        value: your_hf_api_token_here

databases:
  - name: mindcare-db
    plan: free
    databaseName: mindcare_db
    user: mindcare_user
